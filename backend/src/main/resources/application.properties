spring.application.name=CollegeCourseRegistration
server.port=8080

# Database - read from environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CollegeRegistration?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - update creates tables if they don't exist yet, or validates existing ones
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Owner bootstrap from env
app.owner.username=${OWNER_USERNAME:}
app.owner.password=${OWNER_PASSWORD:}
app.owner.email=${OWNER_EMAIL:owner@college.edu}
app.owner.fullname=${OWNER_FULLNAME:System Owner}
